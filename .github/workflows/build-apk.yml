name: Build APK

# Built for phone-only workflow: every push produces a Release with a directly
# tappable .apk. Workflow artifacts are zipped and awkward to open on Android,
# so the Release asset is the primary output and the artifact is just a backup.

on:
  push:
    branches:
      - claude/tiktok-cyrillic-overlay-30vk95
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PcyrfixVersionCode=${{ github.run_number }} \
            -PcyrfixVersionName=1.0.${{ github.run_number }}

      - name: Stage APK
        id: stage
        run: |
          mkdir -p out
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "out/CyrFix-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la out/

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: CyrFix-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.stage.outputs.version }}" \
            out/*.apk \
            --title "CyrFix ${{ steps.stage.outputs.version }}" \
            --notes "$(cat <<'NOTES'
          Debug build, signed with the standard Android debug key, so it installs directly.

          **Install on your phone**
          1. Tap the `.apk` below to download it.
          2. Open it. Allow "install unknown apps" for your browser if prompted.
          3. Open CyrFix and follow the three steps on screen.

          **First run**
          - Enable the accessibility service (Settings -> Accessibility -> Installed apps -> CyrFix).
          - Open TikTok. A round Aa button appears at the edge of the screen.
          - Tap it to correct the comments, tap again to stop. Drag it to move it.

          If nothing gets corrected, turn on Diagnostic mode in the app, open a
          TikTok comment section, then use "Share diagnostic dump".
          NOTES
          )"
